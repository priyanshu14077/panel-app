<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The brand mark: a lit tangerine square with a dark dot, as on the rail and landing. Colours match the Ember tokens. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB067"/>
      <stop offset="0.45" stop-color="#FF7A2E"/>
      <stop offset="1" stop-color="#FF5A1F"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <circle cx="42" cy="42" r="9.5" fill="#1A0B05"/>
</svg>
